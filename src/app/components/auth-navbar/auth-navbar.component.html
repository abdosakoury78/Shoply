<nav class="navbar navbar-expand-lg bg-body-tertiary py-3 sticky-top">
  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand fw-bold text-main" routerLink="/home">
      Shoply
    </a>

    <!-- Mobile Toggle Button -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent"
      aria-controls="navbarContent"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Content -->
    <div class="collapse navbar-collapse" id="navbarContent">

      <ul class="navbar-nav nav-actions-wrapper align-items-lg-center gap-lg-2">

        <!-- Sign In -->
        <li class="nav-item">
          <a
            class="nav-link nav-action"
            routerLink="/signin"
            routerLinkActive="action-active">
            <span>{{ 'navbar.signin' | transloco }}</span>
          </a>
        </li>

        <!-- Sign Up -->
        <li class="nav-item">
          <a
            class="nav-link nav-action"
            routerLink="/signup"
            routerLinkActive="action-active">
            <span>{{ 'navbar.signup' | transloco }}</span>
          </a>
        </li>

        <!-- Language Dropdown Menu (Globe Icon Only) -->
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle btn-lang-dropdown d-flex align-items-center justify-content-center"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            title="Language">
            <i class="fa-solid fa-globe fs-5"></i>
          </a>

          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li>
              <button
                class="dropdown-item d-flex align-items-center gap-2"
                [class.active]="currentLang === 'ar'"
                (click)="changeLanguage('ar')">
                <span>🇪🇬</span>
                <span>عربي</span>
              </button>
            </li>
            <li>
              <button
                class="dropdown-item d-flex align-items-center gap-2"
                [class.active]="currentLang === 'en'"
                (click)="changeLanguage('en')">
                <span>🇬🇧</span>
                <span>English</span>
              </button>
            </li>
          </ul>
        </li>

      </ul>

    </div>

  </div>
</nav>
